# Base of the empty-result-guard experiment: arm A uses it as is; arm B differs only by guard block + skill.
# Arm C (added 2026-10-06 after pilot v4: graph tools called 2 times in 20 runs) differs from A only by a
# "graph-first" block in prompts/analyzer.md that makes the analyzer query the graph before grep.
# It gives no advice on how to read an empty result (that is arm B's treatment).
name: swe_coder
model: gemma-4-31b-it-qat-w4a16-ct
description: Autonomous software engineer that fixes repository issues with minimal, verified patches.
instruction: !include prompts/system.md
generate_content_config: !include configs/sampling.yaml
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
  - agent_tool:
      config_path: sub_agents/code_analyzer.yaml
      skip_summarization: true
